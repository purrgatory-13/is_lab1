plugins {
    id 'java'
    id 'application'
    id 'war'
}

application {
    mainClass = 'org.example.Main'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly 'jakarta.platform:jakarta.jakartaee-web-api:10.0.0'
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    compileOnly 'jakarta.transaction:jakarta.transaction-api:2.0.1'
    implementation 'org.eclipse.persistence:eclipselink:4.0.2'
    implementation 'org.postgresql:postgresql:42.6.0'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.0.Final'
    implementation 'jakarta.enterprise:jakarta.enterprise.cdi-api:4.1.0'
}

test {
    useJUnitPlatform()
}

// Твоя старая таска для jar осталась на месте
tasks.register('fatJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName.set('is_lab1.jar')

    manifest {
        attributes 'Main-Class': 'org.example.Main'
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}

// --- НОВЫЕ ТАСКИ ДЛЯ WAR ---

// Настройка стандартного war-файла
war {
    archiveFileName.set('is_lab1.war')
}

// 1. Таска: Сборка WAR БЕЗ фронта (только бэкенд)
tasks.register('buildWarWithoutFrontend', War) {
    archiveFileName.set('is_lab1_backend.war')
    // Здесь собирается стандартный src/main/webapp + твои скомпилированные классы бэка
}

// 2. Таска: Сборка WAR С ФРОНТОМ (npm run build + упаковка)
// Предполагается, что фронтенд лежит в папке frontend рядом с gradle-проектом (или измени workingDir)
tasks.register('buildFrontend', Exec) {
    workingDir = file('./frontend') // Укажи путь к папке с React-проектом, если она отдельно (например, file('./frontend'))
    commandLine 'npm', 'run', 'build'
}

tasks.register('buildWarWithFrontend', War) {
    dependsOn 'buildFrontend'
    archiveFileName.set('is_lab1_full.war')

    // Копируем скомпилированный билд React (обычно папка dist или build) внутрь варника в корневую папку веб-приложения
    from('frontend/dist') {
    into '.'
    }
}